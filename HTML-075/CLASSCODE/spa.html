<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction to html5</title>
    <style>
      header {
        width: 100%;
        height: 100px;
        background-color: aqua;
        color: white;
        display: flex;
      }
      nav ul {
        display: flex;
        list-style-type: none;
        margin-left: 200px;
      }
      nav ul li {
        padding: 10px;
        margin: 10px;
      }

      nav ul li a {
        text-decoration: none;
        font-size: 30px;
      }

      nav ul li a:hover {
        background-color: blueviolet;
        color: white;
      }
      #home {
        width: 100%;
        height: 500px;
        background-color: magenta;
      }
      #about {
        width: 100%;
        height: 500px;
        background-color: dodgerblue;
      }
      #service {
        width: 100%;
        height: 500px;
        background-color: #2e3e4e;
      }
      #contact {
        width: 100%;
        height: 500px;
        background-color: rgba(184, 123, 167, 0.7);
      }
      footer {
        width: 100%;
        height: 100px;
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <header>
      <p>OLA</p>
      <nav>
        <ul>
          <li><a href="#home">home</a></li>
          <li><a href="#about">about</a></li>
          <li><a href="#service">service</a></li>
          <li><a href="#contact">contact</a></li>
        </ul>
      </nav>
    </header>
    <section id="home">
      <h1>this is a home page</h1>
    </section>
    <section id="about">
      <h1>this is about page</h1>
    </section>
    <section id="service">
      <h1>this is a service page</h1>
    </section>
    <section id="contact">
      <h1>this is a contact page</h1>
    </section>

    <footer>Design by Mr ola</footer>
  </body>
</html>
