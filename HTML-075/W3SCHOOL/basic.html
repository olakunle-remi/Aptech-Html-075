<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>basic</title>
  </head>
  <body>
    <h1>This is a heading</h1>
    <p>this is paragraph</p>
    <br />
    <!------html heading--->
    <h1>This is a heading 1</h1>
    <h2>This is a heading 2</h2>
    <h3>This is a heading 3</h3>
    <h4>This is a heading 4</h4>
    <h5>This is a heading 5</h5>
    <h6>This is a heading 6</h6>
    <br />
    <!----html link---->
    <h2>HTML Link</h2>
    <p>this links are defined with a tag:</p>
    <a href="https://www.w3schools.com">this</a>
    <br />
    <!---html image--->
    <h2>HTML Images</h2>
    <p>this images are defined with a tag:</p>

    <img
      src="https://www.w3schools.com/images/w3schools_green.jpg"
      alt="w3school"
      width="200"
      height="100"
    />
    <br />
    <img src="images/w3.jpeg" alt="w3school" width="200" height="100" />
  </body>
</html>
